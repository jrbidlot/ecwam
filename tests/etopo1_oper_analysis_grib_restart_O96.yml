    idelalt: 21600

    laltas: T
    altimeter_data_file: data/DA_data/altimeter_data_202301010600_to_202301011200.tar.gz

    lsaras: F

analysis.begin: 2023-01-01 00:00:00
analysis.end:   2023-01-01 12:00:00
forecast.begin: 2023-01-01 12:00:00
forecast.end:   2023-01-01 18:00:00

begin: ${analysis.begin}
fcbegin: ${forecast.begin}
end:   ${forecast.end}


nproma: 24
ll1d: T

forcings:
    file:  data/forcings/oper_an_12h_fc_2023010112_06h_O96.grib

    at:
      - begin:     ${analysis.begin}
        end:       ${analysis.end}
        timestep:  06:00
      - begin:     ${forecast.begin}
        end:       ${forecast.end}
        timestep:  01:00 

input:
    from: file
    format: grib
    file:  data/restart/restart_files_2023010100_CY50R1_O96.tar

output:
    fields:
        name:
          - swh         # Significant height of combined wind waves and swell
          - mwd         # Mean wave direction
          - mwp         # Mean wave period
          - pp1d        # Peak wave period
          - dwi         # 10 metre wind direction
          - cdww        # Coefficient of drag with waves
          - wind        # 10 metre wind speed
        format: grib    # (default : grib) or binary
        at:
          - timestep: 06:00

    restart:
        format: grib 
        at:
          - time: ${analysis.end}


